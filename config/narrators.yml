# Narrator collections — loaded by the "Audiobooks Narrators" library mapping in config.yml.
# No include list: every narrator (album Style tag) is a candidate, and that mapping's
# settings.minimum_items: 5 + delete_below_minimum: true keep only narrators with 5+ books.
templates:
  narrator:
    builder_level: album
    smart_filter:
      limit: 1000
      sort_by: title.asc
      all:
        any:                  # any: so a narrator merged via addons (name variants) ORs together
          album_style: <<value>>
        # Ensemble productions don't count towards a narrator. Otherwise every actor in a 7-book
        # full-cast series crosses the 5-book line and gets a "Narrated by" collection.
        album_title.not: "(Dramatized"
        album_style.not: full cast
        album_mood.not:       # full-cast series whose titles and narrator tags don't say so
          - "Series: Harry Potter (Full-Cast Editions)"
          - "Series: The Sandman"
    sort_title: "!30_<<collection_name>>"

dynamic_collections:
  Narrators:
    type: album_style
    title_format: "Narrated by <<key_name>>"
    template: narrator
    exclude:
      - "full cast"           # covered by Full Cast & Dramatized in audiobooks.yml (key is lowercased by Plex)
